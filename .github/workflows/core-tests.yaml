name: Core Tests
on:
  push:
  pull_request:
jobs:
  core-tests:
    name: Build and Test core (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -S core -B build-core -DCMAKE_BUILD_TYPE=Debug -DPORTABLE_CORE_TESTS=ON

      - name: Build
        run: cmake --build build-core --config Debug

      # -V で doctest の集計行 ("test cases: N | N passed" と "assertions:") を必ずログに残す。
      # これが無いと、フィルタが効かず 0 件実行で緑になっても気付けない。
      - name: Test
        run: ctest --test-dir build-core -C Debug --output-on-failure -V
